<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Adding a booking venue</title>
  <desc id="desc">A new venue is a folder in this repository with a robot that looks for openings and books one, speaking RQP/1; a simulator of the site on your own computer, so no test takes a real appointment; and a catalogue of the places it covers. In the app, the California DMV robots (dmq) ship today and a new venue's robot sits beside them. On lineright.org the maintainers add the connector and the line: time zone and hours, the booking form's fields and the least bid. Then the line opens to everybody.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #f6f8fc; stroke: #e1e6f1; }
    .card { fill: #ffffff; stroke: #dce2ef; }
    .sunk { fill: #eef1f8; }
    .code { fill: #1b2340; }
    .ink { fill: #101a2d; } .muted { fill: #56667e; } .faint { fill: #8a99b1; }
    .soft { fill: #e9ecff; } .acc-t { fill: #4338ca; }
    .ok-soft { fill: #dcf5ea; } .ok-t { fill: #047857; }
    .dash { fill: #f3f4ff; stroke: #6366f1; }
    .cell { fill: #dfe4ef; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1526; stroke: #222b44; }
      .card { fill: #161d33; stroke: #29334f; }
      .sunk { fill: #1c2440; }
      .code { fill: #0b1020; }
      .ink { fill: #e8ecf7; } .muted { fill: #a6b1c9; } .faint { fill: #76839f; }
      .soft { fill: #252a5c; } .acc-t { fill: #a5a8ff; }
      .ok-soft { fill: #0f3a2d; } .ok-t { fill: #34d399; }
      .dash { fill: #181e3d; stroke: #7c7ff7; }
      .cell { fill: #2a3352; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="999" height="469" rx="20"/>

  <!-- ===== the kit ===== -->
  <rect class="card" x="20" y="20" width="460" height="430" rx="18"/>
  <text x="44" y="56" class="ink" font-size="18" font-weight="700">A new venue, in this repository</text>
  <text x="44" y="78" class="muted" font-size="13.5">a folder of its own, beside dmq/</text>

  <g class="sunk">
    <rect x="44" y="96" width="412" height="84" rx="14"/>
    <rect x="44" y="192" width="412" height="84" rx="14"/>
    <rect x="44" y="288" width="412" height="84" rx="14"/>
  </g>
  <g class="soft"><circle cx="82" cy="138" r="22"/><circle cx="82" cy="234" r="22"/><circle cx="82" cy="330" r="22"/></g>
  <!-- robot -->
  <rect x="70" y="128" width="24" height="18" rx="5" fill="#4f46e5"/>
  <circle cx="77.5" cy="137" r="2.6" fill="#fff"/><circle cx="86.5" cy="137" r="2.6" fill="#fff"/>
  <path d="M82 128v-5" stroke="#4f46e5" stroke-width="2.2"/><circle cx="82" cy="121.5" r="2.4" fill="#4f46e5"/>
  <path d="M67 134v6M97 134v6" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round"/>
  <!-- simulator: a page in a dashed frame -->
  <rect x="68" y="222" width="28" height="23" rx="4" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="4 2.5"/>
  <path d="M68 228h28" stroke="#4f46e5" stroke-width="2.2"/>
  <rect x="73" y="233" width="7" height="6" rx="1.5" fill="#10b981"/><rect x="83" y="233" width="7" height="6" rx="1.5" fill="#4f46e5" fill-opacity="0.45"/>
  <!-- catalogue: a map pin -->
  <path d="M82 344c-7-8-11-13.5-11-19a11 11 0 0 1 22 0c0 5.5-4 11-11 19z" fill="#4f46e5"/>
  <circle cx="82" cy="325" r="4" fill="#fff"/>

  <g class="ink" font-size="16" font-weight="700">
    <text x="118" y="128">Robot</text><text x="118" y="224">Simulator</text><text x="118" y="320">Catalogue</text>
  </g>
  <g class="muted" font-size="13.5">
    <text x="118" y="149">looks for openings and books one;</text><text x="118" y="167">Node and Playwright, speaking RQP/1</text>
    <text x="118" y="245">the site's pages on your computer,</text><text x="118" y="263">so no test takes a real appointment</text>
    <text x="118" y="341">the places it covers: names,</text><text x="118" y="359">addresses, opening hours</text>
  </g>

  <rect class="code" x="44" y="386" width="412" height="48" rx="10"/>
  <g class="mono" font-size="12.5">
    <text x="60" y="406" fill="#a5b4fc">discovery.request</text><text x="200" y="406" fill="#94a3b8">→ robot →</text><text x="284" y="406" fill="#6ee7b7">discovery.result</text>
    <text x="60" y="425" fill="#a5b4fc">booking.request</text><text x="200" y="425" fill="#94a3b8">→ robot →</text><text x="284" y="425" fill="#6ee7b7">booking.result</text>
  </g>

  <!-- to the app and the site -->
  <path d="M486 236H530" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <path d="M520 226l11 10-11 10" stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M508 236V122H532M508 236V350H532" stroke="#6366f1" stroke-width="2" fill="none" stroke-opacity="0.5"/>

  <!-- ===== in the app ===== -->
  <rect class="card" x="540" y="20" width="440" height="204" rx="18"/>
  <text x="564" y="54" class="ink" font-size="17" font-weight="700">In the app</text>
  <text x="564" y="74" class="muted" font-size="13">every installer carries the robots</text>
  <rect class="sunk" x="564" y="92" width="392" height="50" rx="12"/>
  <path d="M582 108h10l3 3h13v19h-26z" fill="#4f46e5"/>
  <text x="620" y="122" class="mono ink" font-size="14" font-weight="700">dmq/</text>
  <text x="664" y="122" class="muted" font-size="14">California DMV</text>
  <rect class="ok-soft" x="852" y="104" width="90" height="26" rx="13"/>
  <text x="897" y="121.5" class="ok-t" font-size="12.5" font-weight="700" text-anchor="middle">ships today</text>
  <rect class="dash" x="564" y="154" width="392" height="50" rx="12" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M582 170h10l3 3h13v19h-26z" fill="none" stroke="#6366f1" stroke-width="2"/>
  <path d="M595 176v10M590 181h10" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <text x="620" y="184" class="mono acc-t" font-size="14" font-weight="700">your-venue/</text>
  <text x="726" y="184" class="muted" font-size="13.5">a clinic, a consulate…</text>

  <!-- ===== on the site ===== -->
  <rect class="card" x="540" y="244" width="440" height="206" rx="18"/>
  <text x="564" y="278" class="ink" font-size="17" font-weight="700">On lineright.org</text>
  <text x="564" y="298" class="muted" font-size="13">added by the maintainers</text>
  <g class="soft">
    <rect x="564" y="314" width="96" height="28" rx="14"/><rect x="668" y="314" width="84" height="28" rx="14"/><rect x="760" y="314" width="150" height="28" rx="14"/>
    <rect x="564" y="350" width="162" height="28" rx="14"/><rect x="734" y="350" width="118" height="28" rx="14"/>
  </g>
  <g class="acc-t" font-size="13" font-weight="600" text-anchor="middle">
    <text x="612" y="332.5">connector</text><text x="710" y="332.5">the line</text><text x="835" y="332.5">time zone · hours</text>
    <text x="645" y="368.5">booking form fields</text><text x="793" y="368.5">the least bid</text>
  </g>
  <circle cx="574" cy="417" r="10" fill="#10b981"/>
  <path d="M569 417l3.5 3.5 6.5-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="592" y="422" class="ok-t" font-size="14.5" font-weight="700">Then the line opens to everybody</text>
</svg>
