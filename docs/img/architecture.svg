  <circle cx="408" cy="258" r="6" fill="none" stroke="#6366f1" stroke-width="2"/>
  <path d="M408 255v3.5l2.5 1.5" stroke="#6366f1" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M408 285l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#6366f1"/>
  <g class="ink" font-size="14.5">
    <text x="424" y="162">Your profile, kept here</text>
    <text x="424" y="196">Robots: scout, booker</text>
    <text x="424" y="230">Lines, bids, your turn</text>
    <text x="424" y="264">History and alerts</text>
    <text x="424" y="298">AI oversight, if you like</text>
  </g>
  <text x="404" y="338" class="faint" font-size="12.5">Windows · macOS · Linux</text>

