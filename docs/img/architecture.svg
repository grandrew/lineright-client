  <text x="810" y="95" class="ink" font-size="18" font-weight="700">Booking site</text>
  <text x="810" y="114" class="muted" font-size="13">dmv.ca.gov today</text>
  <path class="rule" d="M760 132H960" stroke-width="1.5"/>
  <rect class="sunk" x="764" y="148" width="192" height="134" rx="10"/>
