  <path d="M370 422l10-5 10 5v12l-10 5-10-5z" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M370 422l10 5 10-5M380 427v12" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linejoin="round"/>
