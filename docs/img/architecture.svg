  <rect class="soft" x="44" y="95" width="34" height="13" rx="3.5" stroke="#6366f1" stroke-width="2"/>
  <circle cx="51" cy="84.5" r="2" fill="#6366f1"/><circle cx="51" cy="101.5" r="2" fill="#6366f1"/>
  <text x="90" y="95" class="ink" font-size="18" font-weight="700">lineright.org</text>
  <text x="90" y="114" class="muted" font-size="13">the server</text>
  <path class="rule" d="M40 132H240" stroke-width="1.5"/>
  <g fill="#6366f1">
    <circle cx="48" cy="157" r="4"/><circle cx="48" cy="191" r="4"/><circle cx="48" cy="225" r="4"/><circle cx="48" cy="259" r="4"/><circle cx="48" cy="293" r="4"/>
  </g>
  <g class="ink" font-size="14.5">
    <text x="62" y="162">Lines and order books</text>
    <text x="62" y="196">Credits, bids, escrow</text>
    <text x="62" y="230">Who checks what, when</text>
    <text x="62" y="264">Statistics for everyone</text>
    <text x="62" y="298">History of every turn</text>
  </g>
  <text x="44" y="338" class="faint" font-size="12.5">not open source</text>

