  <g class="cell">
    <rect x="776" y="174" width="28" height="22" rx="5"/><rect x="810" y="174" width="28" height="22" rx="5"/><rect x="844" y="174" width="28" height="22" rx="5"/><rect x="878" y="174" width="28" height="22" rx="5"/><rect x="912" y="174" width="28" height="22" rx="5"/>
    <rect x="776" y="202" width="28" height="22" rx="5"/><rect x="844" y="202" width="28" height="22" rx="5"/><rect x="878" y="202" width="28" height="22" rx="5"/><rect x="912" y="202" width="28" height="22" rx="5"/>
    <rect x="776" y="230" width="28" height="22" rx="5"/><rect x="810" y="230" width="28" height="22" rx="5"/><rect x="844" y="230" width="28" height="22" rx="5"/><rect x="878" y="230" width="28" height="22" rx="5"/><rect x="912" y="230" width="28" height="22" rx="5"/>
