<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Who does what: the server, the app, and the booking site</title>
  <desc id="desc">The server, lineright.org, keeps the lines and order books, credits and escrow, which app checks what and when, statistics and history. It sends the app lines to check, your turn and statistics; the app sends back what was found and whether a turn was booked or passed, as JSON over HTTPS. The app, from this repository, keeps your profile, runs the robots, shows the lines and your turn, and can use AI oversight. Its robots look and book on the booking site in a real browser, and bring back openings and confirmation numbers. Your details stay with you; no code comes from the server; the robots check a booking site from your connection only if you agree.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f8fc; stroke: #e1e6f1; }
    .card { fill: #ffffff; stroke: #dce2ef; }
    .sunk { fill: #eef1f8; }
    .ink { fill: #101a2d; } .muted { fill: #56667e; } .faint { fill: #8a99b1; }
    .rule { stroke: #e6eaf3; }
    .cell { fill: #dfe4ef; }
    .soft { fill: #e9ecff; }
    .accent { fill: #4f46e5; } .accent-s { stroke: #4f46e5; }
    .gold-soft { fill: #fff3d6; } .ok-soft { fill: #dcf5ea; }
    .mine { fill: #ffffff; stroke: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1526; stroke: #222b44; }
      .card { fill: #161d33; stroke: #29334f; }
      .sunk { fill: #1c2440; }
      .ink { fill: #e8ecf7; } .muted { fill: #a6b1c9; } .faint { fill: #76839f; }
      .rule { stroke: #252e48; }
      .cell { fill: #2a3352; }
      .soft { fill: #252a5c; }
      .accent { fill: #7c7ff7; } .accent-s { stroke: #7c7ff7; }
      .gold-soft { fill: #3a2a0e; } .ok-soft { fill: #0f3a2d; }
      .mine { fill: #161d33; stroke: #7c7ff7; }
    }
  </style>
