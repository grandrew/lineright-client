<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">A California DMV line, and how one opening is handed out</title>
  <desc id="desc">The REAL ID line has five bids, ranked by amount. A cancellation opens at the Poway office on October 15 at 10:20. The top bid, for El Cajon and Santee, does not want Poway and is skipped. You are second and want Poway, so the slot is offered to you first, and a few seconds later to the third bid, which also wants Poway. The bids for Oceanside and San Diego are skipped. Whoever books it first has it.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f8fc; stroke: #e1e6f1; }
    .card { fill: #ffffff; stroke: #dce2ef; }
    .sunk { fill: #eef1f8; }
    .ink { fill: #101a2d; } .muted { fill: #56667e; } .faint { fill: #8a99b1; }
    .label { fill: #8a99b1; }
    .rule { stroke: #e6eaf3; }
    .cell { fill: #e4e8f2; }
    .num { fill: #e9ecff; } .num-t { fill: #3f3ac0; }
    .acc-t { fill: #4338ca; }
    .gold-t { fill: #a14a06; } .gold-g { fill: #d97706; }
    .you { fill: #fff6e0; stroke: #f3c46b; }
    .ok-soft { fill: #dcf5ea; } .ok-t { fill: #047857; }
    .accent { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1526; stroke: #222b44; }
      .card { fill: #161d33; stroke: #29334f; }
      .sunk { fill: #1c2440; }
      .ink { fill: #e8ecf7; } .muted { fill: #a6b1c9; } .faint { fill: #76839f; }
      .label { fill: #76839f; }
      .rule { stroke: #252e48; }
      .cell { fill: #252e4a; }
      .num { fill: #252a5c; } .num-t { fill: #b9bbff; }
      .acc-t { fill: #a5a8ff; }
      .gold-t { fill: #fbbf24; } .gold-g { fill: #fbbf24; }
      .you { fill: #33270f; stroke: #8a6418; }
      .ok-soft { fill: #0f3a2d; } .ok-t { fill: #34d399; }
      .accent { fill: #7c7ff7; }
    }
  </style>
  <defs>
    <marker id="gold-tip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9Z" fill="#f59e0b"/>
    </marker>
    <marker id="acc-tip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="559" rx="20"/>

  <!-- ===== the line ===== -->
  <rect class="card" x="20" y="20" width="556" height="520" rx="18"/>
  <g class="accent">
    <path d="M44 52 62 40 80 52Z"/>
    <rect x="46" y="54" width="32" height="3.5"/>
    <rect x="48" y="60" width="5" height="12"/><rect x="56.5" y="60" width="5" height="12"/><rect x="65" y="60" width="5" height="12"/><rect x="73.5" y="60" width="4.5" height="12"/>
    <rect x="44" y="73" width="36" height="4" rx="1"/>
  </g>
  <text x="94" y="60" class="ink" font-size="20" font-weight="700">California DMV · REAL ID</text>
  <text x="94" y="82" class="muted" font-size="14">One line, ranked by bid; among equal bids, who came first.</text>

  <g class="label" font-size="12" font-weight="700" letter-spacing="1">
    <text x="44" y="122">#</text><text x="84" y="122">IN LINE</text><text x="300" y="122">WANTS</text><text x="552" y="122" text-anchor="end">BID</text>
  </g>
  <path class="rule" d="M36 134H560M36 212H560M36 284H560M36 356H560M36 428H560" stroke-width="1.5"/>

  <!-- you -->
  <rect class="you" x="30" y="216" width="536" height="64" rx="12" stroke-width="1.5"/>

  <g class="muted" font-size="16" font-weight="700">
    <text x="44" y="182">#1</text><text x="44" y="254">#2</text><text x="44" y="326">#3</text><text x="44" y="398">#4</text><text x="44" y="470">#5</text>
  </g>

  <circle cx="100" cy="177" r="16" fill="#0ea5e9"/>
  <circle cx="100" cy="249" r="16" fill="#f59e0b"/>
  <circle cx="100" cy="321" r="16" fill="#14b8a6"/>
  <circle cx="100" cy="393" r="16" fill="#8b5cf6"/>
  <circle cx="100" cy="465" r="16" fill="#64748b"/>
  <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="100" y="182">Q</text><text x="100" y="254">Y</text><text x="100" y="326">C</text><text x="100" y="398">S</text><text x="100" y="470">P</text>
  </g>

  <g class="ink" font-size="16" font-weight="700">
    <text x="126" y="172">quiet_otter</text>
    <text x="126" y="244">You</text>
    <text x="126" y="316">copper_finch</text>
    <text x="126" y="388">salt_lantern</text>
    <text x="126" y="460">paper_kestrel</text>
  </g>
  <g font-size="13.5">
    <text x="126" y="194" class="faint">skipped: not Poway</text>
    <text x="126" y="266" class="gold-t" font-weight="700">offered first</text>
    <text x="126" y="338" class="acc-t" font-weight="700">offered seconds later</text>
    <text x="126" y="410" class="faint">skipped: not Poway</text>
    <text x="126" y="482" class="faint">skipped: not Poway</text>
  </g>

  <g class="ink" font-size="15">
    <text x="300" y="172">El Cajon · Santee</text>
    <text x="300" y="244">Poway, or within 10 mi</text>
    <text x="300" y="316">Poway · Escondido</text>
    <text x="300" y="388">Oceanside · Vista</text>
    <text x="300" y="460">San Diego (Clairemont)</text>
  </g>
  <g class="faint" font-size="13.5">
    <text x="300" y="194">before Dec 15</text>
    <text x="300" y="266">before Nov 30</text>
    <text x="300" y="338">before Dec 31</text>
    <text x="300" y="410">before Jan 15</text>
    <text x="300" y="482">before Dec 1</text>
  </g>

  <g class="gold-g">
    <path d="M510 170h10l-10 15h10z"/><path d="M510 242h10l-10 15h10z"/><path d="M520 314h10l-10 15h10z"/>
    <path d="M520 386h10l-10 15h10z"/><path d="M520 458h10l-10 15h10z"/>
  </g>
  <g class="ink" font-size="17" font-weight="700" text-anchor="end">
    <text x="556" y="184">140</text><text x="556" y="256">120</text><text x="556" y="328">95</text><text x="556" y="400">80</text><text x="556" y="472">60</text>
  </g>

  <text x="44" y="524" class="muted" font-size="13.5">The bid decides who is served first; distance decides which slot.</text>

  <!-- ===== the booking site ===== -->
  <rect class="card" x="600" y="20" width="380" height="300" rx="18"/>
  <circle cx="624" cy="42" r="5.5" fill="#f87171"/><circle cx="641" cy="42" r="5.5" fill="#fbbf24"/><circle cx="658" cy="42" r="5.5" fill="#34d399"/>
  <rect class="sunk" x="676" y="31" width="288" height="22" rx="11"/>
  <text x="692" y="46.5" class="muted" font-size="12.5">dmv.ca.gov · appointments</text>
  <path class="rule" d="M600 64H980" stroke-width="1.5"/>
  <text x="624" y="96" class="ink" font-size="18" font-weight="700">Poway</text>
  <text x="624" y="117" class="muted" font-size="13.5">REAL ID · October · booked solid</text>

  <g class="cell">
    <rect x="629" y="132" width="40" height="30" rx="6"/><rect x="676" y="132" width="40" height="30" rx="6"/><rect x="723" y="132" width="40" height="30" rx="6"/><rect x="770" y="132" width="40" height="30" rx="6"/><rect x="817" y="132" width="40" height="30" rx="6"/><rect x="864" y="132" width="40" height="30" rx="6"/><rect x="911" y="132" width="40" height="30" rx="6"/>
    <rect x="629" y="169" width="40" height="30" rx="6"/><rect x="676" y="169" width="40" height="30" rx="6"/><rect x="723" y="169" width="40" height="30" rx="6"/><rect x="770" y="169" width="40" height="30" rx="6"/><rect x="817" y="169" width="40" height="30" rx="6"/><rect x="864" y="169" width="40" height="30" rx="6"/><rect x="911" y="169" width="40" height="30" rx="6"/>
    <rect x="676" y="206" width="40" height="30" rx="6"/><rect x="723" y="206" width="40" height="30" rx="6"/><rect x="770" y="206" width="40" height="30" rx="6"/><rect x="817" y="206" width="40" height="30" rx="6"/><rect x="864" y="206" width="40" height="30" rx="6"/><rect x="911" y="206" width="40" height="30" rx="6"/>
    <rect x="629" y="243" width="40" height="30" rx="6"/><rect x="676" y="243" width="40" height="30" rx="6"/><rect x="723" y="243" width="40" height="30" rx="6"/><rect x="770" y="243" width="40" height="30" rx="6"/><rect x="817" y="243" width="40" height="30" rx="6"/><rect x="864" y="243" width="40" height="30" rx="6"/><rect x="911" y="243" width="40" height="30" rx="6"/>
  </g>
  <g class="faint" font-size="11">
    <text x="635" y="145">1</text><text x="682" y="145">2</text><text x="729" y="145">3</text><text x="776" y="145">4</text><text x="823" y="145">5</text><text x="870" y="145">6</text><text x="917" y="145">7</text>
    <text x="635" y="182">8</text><text x="682" y="182">9</text><text x="729" y="182">10</text><text x="776" y="182">11</text><text x="823" y="182">12</text><text x="870" y="182">13</text><text x="917" y="182">14</text>
    <text x="682" y="219">16</text><text x="729" y="219">17</text><text x="776" y="219">18</text><text x="823" y="219">19</text><text x="870" y="219">20</text><text x="917" y="219">21</text>
    <text x="635" y="256">22</text><text x="682" y="256">23</text><text x="729" y="256">24</text><text x="776" y="256">25</text><text x="823" y="256">26</text><text x="870" y="256">27</text><text x="917" y="256">28</text>
  </g>
  <rect x="623" y="200" width="52" height="42" rx="10" fill="none" stroke="#10b981" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="629" y="206" width="40" height="30" rx="6" fill="#10b981"/>
  <text x="635" y="219" font-size="11" font-weight="700" fill="#fff">15</text>
  <path d="M648 225l3.5 3.5 7-7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="ok-soft" x="629" y="284" width="250" height="24" rx="12"/>
  <circle cx="643" cy="296" r="4.5" fill="#10b981"/>
  <text x="654" y="300.5" class="ok-t" font-size="13" font-weight="700">Oct 15 at 10:20 · just opened</text>

  <!-- the opening goes to the line -->
  <path d="M624 221C602 222 596 247 572 248" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#gold-tip)"/>
  <path d="M627 232C604 268 600 318 572 320" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#acc-tip)"/>

  <!-- ===== the rule ===== -->
  <rect class="card" x="600" y="340" width="380" height="200" rx="18"/>
  <text x="624" y="373" class="ink" font-size="16.5" font-weight="700">How an opening is handed out</text>
  <g class="num">
    <circle cx="634" cy="397" r="10"/><circle cx="634" cy="425" r="10"/><circle cx="634" cy="453" r="10"/><circle cx="634" cy="481" r="10"/><circle cx="634" cy="509" r="10"/>
  </g>
  <g class="num-t" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="634" y="401">1</text><text x="634" y="429">2</text><text x="634" y="457">3</text><text x="634" y="485">4</text><text x="634" y="513">5</text>
  </g>
  <g class="ink" font-size="14">
    <text x="654" y="402">Walk the line from the top bid down.</text>
    <text x="654" y="430">Skip bids that don't want this slot.</text>
    <text x="654" y="458">Offer it to the first that does,</text>
    <text x="654" y="486">then to the next, seconds later.</text>
    <text x="654" y="514">The first to book it has it.</text>
  </g>
</svg>
